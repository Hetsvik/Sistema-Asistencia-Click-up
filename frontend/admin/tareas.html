<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<title>Tareas · Intranet Arquitectura &amp; Servicios Generales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-role="admin" class="is-loading">
<noscript><p style="padding:2rem;color:#f3d98b">Esta aplicación necesita JavaScript habilitado.</p></noscript>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Tareas</h1>
        <p class="page-sub">Asigna y supervisa tareas</p>
      </div>
      <div class="top-actions">
        <div class="notif-wrap">
          <button class="icon-btn" id="bell" type="button" aria-label="Notificaciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><span class="dot" hidden></span></button>
          <div class="notif-panel" id="notif-panel" hidden></div>
        </div>
        <label for="menu-check" class="icon-btn menu-toggle" aria-label="Abrir menú"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
      </div>
    </header>
    <div class="toolbar">
      <button class="btn" id="btn-add" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Añadir Tarea</button>
      <div class="search grow"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="task-search" class="input" type="search" placeholder="Buscar tarea o trabajador"></div>
    </div>
    <div class="task-head"><span>Nro°</span><span>Nombre</span><span>Descripción</span><span>Fecha</span><span>Prioridad</span><span>Estado</span>
      <button class="filter" id="btn-filter" type="button" aria-haspopup="true" aria-label="Filtrar por estado"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/></svg>Filtrar</button>
      <div class="filter-menu" id="filter-menu" hidden></div></div>
    <section id="task-list" aria-live="polite"><div class="empty-state"><strong>Cargando…</strong></div></section>
  </main>
</div>
<script type="module" src="/js/pages/tareas.js"></script>
</body>
</html>
