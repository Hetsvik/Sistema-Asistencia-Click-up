<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<title>Calendario · Intranet Arquitectura &amp; Servicios Generales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/modulos.css">
</head>
<body data-role="trabajador" class="is-loading module-page">
<noscript><p>Esta aplicación necesita JavaScript habilitado.</p></noscript>
<div class="app"><main class="main">
<header class="topbar">
  <div><h1 class="page-title">Calendario</h1><p class="page-sub">Organiza tu jornada, un día a la vez</p></div>
  <div class="top-actions">
    <div class="notif-wrap"><button class="icon-btn" id="bell" type="button" aria-label="Notificaciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><span class="dot" hidden></span></button><div class="notif-panel" id="notif-panel" hidden></div></div>
    <label for="menu-check" class="icon-btn menu-toggle" aria-label="Abrir menú" role="button" tabindex="0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
  </div>
</header>
<section class="calendar-card card" aria-label="Calendario mensual">
<div class="calendar-toolbar">
  <div class="month-controls"><button class="icon-btn" type="button" id="month-prev" aria-label="Mes anterior">‹</button><h2 id="month-label" aria-live="polite"></h2><button class="icon-btn" type="button" id="month-next" aria-label="Mes siguiente">›</button></div>
  <button class="btn outline" type="button" id="calendar-today">Hoy</button>
</div>
<div class="calendar-weekdays" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
<div class="calendar-grid" id="calendar-grid" aria-label="Días del mes"></div>
<div class="calendar-footer"><p id="selected-date" role="status"></p><span class="calendar-key"><i aria-hidden="true"></i>Hoy</span></div>
</section>
</main></div>
<script type="module" src="/js/pages/calendario.js"></script>
</body></html>
