<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<title>Crear proyecto · Intranet Arquitectura &amp; Servicios Generales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/modulos.css">
</head>
<body data-role="admin" class="is-loading module-page">
<noscript><p>Esta aplicación necesita JavaScript habilitado.</p></noscript>
<div class="app"><main class="main">
<header class="topbar">
  <div><h1 class="page-title">Crear proyecto</h1><p class="page-sub">Define los datos y la fecha del proyecto</p></div>
  <div class="top-actions">
    <div class="notif-wrap"><button class="icon-btn" id="bell" type="button" aria-label="Notificaciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><span class="dot" hidden></span></button><div class="notif-panel" id="notif-panel" hidden></div></div>
    <label for="menu-check" class="icon-btn menu-toggle" aria-label="Abrir menú" role="button" tabindex="0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
  </div>
</header>
<a class="module-back" href="/admin/proyectos">← Volver a proyectos</a>
<form id="project-form" class="module-form card"><div class="form-intro"><p class="module-eyebrow">Planificación del equipo</p><h2>Datos del proyecto</h2></div>
<label class="form-field">Nombre del proyecto *<input class="input plain" name="nombre" maxlength="120" required autocomplete="off"></label>
<label class="form-field">Área / departamento *<input class="input plain" name="area" maxlength="80" required autocomplete="off"></label>
<label class="form-field">Descripción *<textarea class="input plain" name="descripcion" rows="4" maxlength="2000" required></textarea></label>
<div id="project-datetime"></div><p id="project-error" class="module-message error" role="alert" hidden></p>
<div class="module-actions"><button type="submit" class="btn">Crear proyecto</button><a href="/admin/proyectos" class="btn outline">Cancelar</a></div></form>
</main></div>
<script type="module" src="/js/pages/proyecto-form.js"></script>
</body></html>
