<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/static/9bbe708cfcd5b11e/js/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<title>Asistencia · Intranet Arquitectura &amp; Servicios Generales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="/static/9bbe708cfcd5b11e/css/styles.css">
<link rel="stylesheet" href="/static/9bbe708cfcd5b11e/css/modulos.css">
</head>
<body class="is-loading module-page" data-role="trabajador">
<noscript><p style="padding:2rem;color:#f3d98b">Esta aplicación necesita JavaScript habilitado.</p></noscript>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Asistencia</h1>
        <p class="page-sub">Control de entradas y salidas</p>
      </div>
      <div class="top-actions">
        <div class="notif-wrap">
          <button class="icon-btn" id="bell" type="button" aria-label="Notificaciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><span class="dot" hidden></span></button>
          <div class="notif-panel" id="notif-panel" hidden></div>
        </div>
        <label for="menu-check" class="icon-btn menu-toggle" aria-label="Abrir menú"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
      </div>
    </header>
<section class="attendance-top"><div class="clock"><span>Hora de Perú</span><b id="clock-time">--:--</b><span id="clock-date"></span></div><div class="btn-row"><button class="btn" type="button" id="btn-in" disabled>Marcar entrada</button><button class="btn outline" type="button" id="btn-out" disabled>Marcar salida</button></div></section><p id="att-status" class="attendance-status" role="status"></p><div id="my-plan" class="my-plan"></div><section class="card" id="history-panel" aria-labelledby="history-heading" >
<h2 id="history-heading">Mi historial de asistencia</h2>
<div class="metrics-toolbar"><label>Desde<input class="input plain" id="att-from" type="date"></label><label>Hasta<input class="input plain" id="att-to" type="date"></label></div>
<div class="table-wrap"><table><thead><tr><th>Fecha / tramo</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead><tbody id="att-body"></tbody></table></div>
<div class="metrics-pagination"><button class="btn outline" id="history-prev" type="button">Anterior</button><span id="history-page" role="status"></span><button class="btn outline" id="history-next" type="button">Siguiente</button></div></section>
  </main>
</div>
<script type="module" src="/static/9bbe708cfcd5b11e/js/pages/asistencia.js"></script>
</body>
</html>
