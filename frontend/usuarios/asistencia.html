<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<title>Asistencia · Intranet Arquitectura &amp; Servicios Generales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-role="trabajador" class="is-loading">
<noscript><p style="padding:2rem;color:#f3d98b">Esta aplicación necesita JavaScript habilitado.</p></noscript>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Asistencia</h1>
        <p class="page-sub">Control de entradas y salidas</p>
      </div>
      <div class="top-actions">
        <div class="notif-wrap">
          <button class="icon-btn" id="bell" type="button" aria-label="Notificaciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><span class="dot" hidden></span></button>
          <div class="notif-panel" id="notif-panel" hidden></div>
        </div>
        <label for="menu-check" class="icon-btn menu-toggle" aria-label="Abrir menú"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
      </div>
    </header>
    <section class="attendance-top">
      <div class="clock"><span>Hora actual</span><b id="clock-time">--:--</b><span id="clock-date">&nbsp;</span></div>
      <div class="btn-row">
        <button class="btn lg" id="btn-in" type="button" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>Marcar Entrada</button>
        <button class="btn lg outline" id="btn-out" type="button" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Marcar Salida</button>
      </div>
    </section>
    <p class="attendance-status" id="att-status" aria-live="polite">Cargando…</p>
    <section class="card">
      <h2>Mi historial</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Hora Ingreso</th><th>Hora Salida</th><th>Estado</th></tr></thead>
        <tbody id="att-body"><tr><td colspan="4" class="empty">Cargando…</td></tr></tbody>
      </table></div>
    </section>
  </main>
</div>
<script type="module" src="/js/pages/asistencia.js"></script>
</body>
</html>
